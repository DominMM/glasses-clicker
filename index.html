<style>

  .row button { flex: 1; padding: 16px 0; }

    g.beginPath(); g.arc((x + .5) * s, (y + .5) * s, s * .38, 0, 7); g.fill();
  }
}
function draw(i) {
  const sl = slideAt(i);
  clearInterval(animTimer); animTimer = null;
  paint(sl.frames[0]);
  if (sl.frames.length > 1) { let k = 0; animTimer = setInterval(() => { k = (k + 1) % sl.frames.length; paint(sl.frames[k]); }, 350); }
  $("label").textContent = i < 0 ? "Blank" : `${i + 1}. ${sl.name}` + (sl.frames.length > 1 ? " (animated)" : "");
  const n = nextIndex(i);
  $("upnext").textContent = "NEXT shows: " + (n < 0 ? "blank" : `${n + 1}. ${SL[n].name}`);
  document.querySelectorAll("#thumbs button").forEach((b, k) => b.classList.toggle("on", k === i));
}
function nextIndex(i) { return i >= SL.length - 1 ? -1 : i + 1; }
function prevIndex(i) { return i < 0 ? SL.length - 1 : i - 1; }

function onNotify() { acks++; if (wake) { const w = wake; wake = null; w(); } }
function ack(ms = 3000) {
  return new Promise((res, rej) => {
    if (acks > 0) { acks--; return res(); }
    const t = setTimeout(() => { wake = null; rej(new Error("glasses did not answer")); }, ms);
    wake = () => { clearTimeout(t); acks--; res(); };
  });
}
async function upload(bytes) {
  acks = 0;
  await chCmd.writeValueWithResponse(DATS); await ack();
  for (let off = 0, n = 0; off < bytes.length; off += CHUNK, n++) {
    const part = bytes.subarray(off, off + CHUNK), pkt = new Uint8Array(part.length + 2);
    pkt[0] = part.length + 1; pkt[1] = n & 255; pkt.set(part, 2);
    await chData.writeValueWithoutResponse(pkt); await ack();
  }
  await chCmd.writeValueWithResponse(DATCP); await ack();
}
// A still is one upload. An animation is stored as a set that loops on the glasses.
async function sendSlide(sl) {
  if (!sl.many) return upload(sl.frames[0]);
  acks = 0;
  await chCmd.writeValueWithResponse(sl.many); await ack();
  for (const f of sl.frames) await upload(f);
  acks = 0;
  await chCmd.writeValueWithResponse(MANCPOK); await ack(8000);
  if (sl.speed) { await chCmd.writeValueWithResponse(sl.speed); await sleep(150); }
  await chCmd.writeValueWithResponse(PLAY);
}
async function show(i) {
  pos = i; wanted = slideAt(i); draw(i);
  if (busy || !linked) return;
  busy = true;
  try {
    while (shown !== wanted) {
      const sl = wanted;
      let lastErr = null;
      if (sl.frames.length > 1) setStatus("Sending animation...");
      for (let attempt = 0; attempt < 2; attempt++) {
        try { await sendSlide(sl); lastErr = null; break; }
        catch (e) { lastErr = e; await sleep(250); }
      }
      if (lastErr) throw lastErr;
      shown = sl;
      if (navigator.vibrate) navigator.vibrate(25);
    }
    setStatus("Connected", "ok");
  } catch (e) {
    setStatus("Send failed: " + e.message, "bad");
  } finally { busy = false; }
}
function selectStory(k) {
  story = k; SL = ST[k].slides;
  document.querySelectorAll("#stories button").forEach((b, n) => b.classList.toggle("on", n === k));
  const t = $("thumbs"); t.textContent = "";
  SL.forEach((s, i) => {
    const b = document.createElement("button"); b.textContent = i + 1; b.title = s.name;
    b.onclick = () => { stopLoop(); show(i); }; t.appendChild(b);
  });
}
// Picking a storyline goes to its start: the glasses go blank and NEXT shows its first slide.
function pickStory(k) { stopLoop(); selectStory(k); show(-1); }

// Loop all: every slide of every storyline in turn, a short blank after each storyline.
// A slide's seconds are counted from the moment it has arrived on the glasses.
const LOOP = [];
ST.forEach((st, k) => { st.slides.forEach((s, i) => LOOP.push({ k, i, secs: s.secs })); LOOP.push({ k, i: -1, secs: GAP }); });
let loopRun = 0, loopIds = 0;      // loopRun: 0 = not looping, else the id of the running loop
function stopLoop() {
  if (!loopRun) return;
  loopRun = 0; $("loop").textContent = "Loop all"; $("loop").classList.remove("on"); draw(pos);
}
async function startLoop() {
  const id = loopRun = ++loopIds;
  $("loop").textContent = "Stop loop"; $("loop").classList.add("on");
  let n = 0, fails = 0;
  while (loopRun === id) {
    const step = LOOP[n];
    if (step.k !== story) selectStory(step.k);
    show(step.i);
    $("upnext").textContent = "Loop: sending...";
    while (loopRun === id && (busy || !linked)) await sleep(100);
    if (loopRun !== id) return;
    if (shown !== wanted) {                      // the send failed; the status line says why
      if (++fails >= 3) return stopLoop();
      await sleep(1500); continue;
    }
    fails = 0;
    const end = Date.now() + step.secs * 1000;
    while (loopRun === id && Date.now() < end) {
      $("upnext").textContent = `Loop: ${Math.ceil((end - Date.now()) / 1000)} s left of ${step.secs} s`;
      await sleep(Math.min(200, end - Date.now()));
    }
    n = (n + 1) % LOOP.length;
  }
}

async function link() {
  const gatt = await dev.gatt.connect();
  const svc = await gatt.getPrimaryService(SVC);
  chCmd = await svc.getCharacteristic(CH_CMD);
  chData = await svc.getCharacteristic(CH_DATA);
  const n = await svc.getCharacteristic(CH_NOTIFY);
  n.addEventListener("characteristicvaluechanged", onNotify);
  await n.startNotifications();
  linked = true; enable(true); setStatus("Connected to " + (dev.name || "glasses"), "ok");
}
async function onDisconnected() {
  linked = false; busy = false; shown = null;    // unknown: resend on reconnect
  if (userLeft) return;
  for (let i = 1; i <= 20 && !linked; i++) {
    setStatus(`Connection lost, retrying (${i})...`, "bad");
    try { await link(); show(pos); return; }
    catch (e) { await new Promise(r => setTimeout(r, 1500)); }
  }
  if (!linked) { stopLoop(); enable(false); setStatus("Disconnected. Tap Connect.", "bad"); }
}
async function connect() {
  if (!navigator.bluetooth) { setStatus("This browser can't use Bluetooth. Use Chrome on Android.", "bad"); return; }
  try {
    setStatus("Choose GLASSES in the list...");
    dev = await navigator.bluetooth.requestDevice({ filters: [{ namePrefix: "GLASSES" }], optionalServices: [SVC] });
    dev.addEventListener("gattserverdisconnected", onDisconnected);
    setStatus("Connecting...");
    await link();
    keepAwake();
  } catch (e) { setStatus(e.name === "NotFoundError" ? "Not connected" : "Could not connect: " + e.message, "bad"); }
}
async function keepAwake() {
  try { if ("wakeLock" in navigator && document.visibilityState === "visible") lock = await navigator.wakeLock.request("screen"); } catch (e) {}
}
document.addEventListener("visibilitychange", () => { if (linked) keepAwake(); });

$("connect").onclick = connect;
$("next").onclick = () => { stopLoop(); show(nextIndex(pos)); };
$("back").onclick = () => { stopLoop(); show(prevIndex(pos)); };
$("blank").onclick = () => { stopLoop(); show(-1); };
$("loop").onclick = () => { if (loopRun) stopLoop(); else startLoop(); };
ST.forEach((st, k) => {
  const b = document.createElement("button"); b.textContent = st.name;
  b.onclick = () => pickStory(k); $("stories").appendChild(b);
});
pickStory(0);
if (!navigator.bluetooth) setStatus("This browser can't use Bluetooth. Use Chrome on Android.", "bad");
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body>
</html>
